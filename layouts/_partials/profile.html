{{ $align := .align | default "center" }}
<section
  class="flex flex-col items-end content-end"
>
     <h2 class="text-4xl text-neutral-500 dark:text-neutral-400">
      Software Developer
    </h2>
  <h1 class="text-6xl chilanka text-right">
    {{ site.Language.Params.Author.name | default site.Title }}
  </h1>
  {{ with site.Language.Params.Author.headline }}
    <h3 class="text-2xl text-neutral-500 dark:text-neutral-400">
      {{ . | markdownify | emojify }}
    </h3>
  {{ end }}
  <div class="mt-1 text-2xl">
    {{ partialCached "author-links.html" . }}
  </div>
</section>
